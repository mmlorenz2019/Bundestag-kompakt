<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bundestag-Kompakt</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#0b1220">
<style>
  :root {
    --bg: #0b1220;
    --card: #141d30;
    --card-hover: #182339;
    --border: #24314a;
    --ink: #e8ecf5;
    --ink-dim: #8b98b3;
    --ink-faint: #5c6a87;
    --accent: #5b8def;
    --accent-soft: rgba(91, 141, 239, 0.14);

    --green: #4ade80;
    --green-bg: rgba(74, 222, 128, 0.14);
    --red: #f87171;
    --red-bg: rgba(248, 113, 113, 0.14);
    --neutral: #8b98b3;
    --neutral-bg: rgba(139, 152, 179, 0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    padding: 1.75rem 1.5rem 1.25rem;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
  header p { margin: 0.3rem 0 0; color: var(--ink-dim); font-size: 0.875rem; }
  .filter-bar {
    max-width: 720px;
    margin: 0 auto;
    padding: 0.75rem 1.5rem 0;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .filter-bar[hidden] { display: none; }
  .filter-bar label { font-size: 0.85rem; color: var(--ink-dim); flex-shrink: 0; }
  .filter-bar select,
  .filter-bar input[type="search"] {
    font-size: 0.85rem;
    padding: 0.4rem 0.7rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink);
  }
  .filter-bar select:focus,
  .filter-bar input[type="search"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .filter-bar input[type="search"] { flex: 1; min-width: 0; }
  .stats-bar {
    max-width: 720px;
    margin: 0.9rem auto 0;
    padding: 0 1.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .stat-chip {
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.3rem 0.75rem;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--ink-dim);
  }
  .stat-chip.stat-angenommen { color: var(--green); }
  .stat-chip.stat-abgelehnt { color: var(--red); }
  main { max-width: 720px; margin: 0 auto; padding: 1.5rem; }
  .state-message {
    text-align: center;
    color: var(--ink-dim);
    padding: 3rem 1rem;
  }
  .group-title {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    margin: 2.25rem 0 0.75rem;
  }
  .group-title:first-child { margin-top: 0; }
  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 0.75rem;
    overflow: hidden;
    transition: background 0.15s ease;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--neutral);
  }
  .card.status-angenommen::before { background: var(--green); }
  .card.status-abgelehnt::before { background: var(--red); }
  .card-summary:hover { background: var(--card-hover); }
  .card-summary {
    padding: 1.1rem 1.1rem 1rem;
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
  }
  .card-summary::-webkit-details-marker { display: none; }
  .card-summary h2 {
    flex: 1 1 auto;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.4;
  }
  .summary-right {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    margin-top: 0.1rem;
  }
  .badge-stack { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
  .badge-date { font-size: 0.7rem; color: var(--ink-faint); }
  .chevron { color: var(--ink-faint); flex-shrink: 0; transition: transform 0.15s ease; }
  details[open] .chevron { transform: rotate(90deg); }
  .status-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.3rem;
    min-width: 7.5rem;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .status-badge.status-angenommen { background: var(--green-bg); color: var(--green); }
  .status-badge.status-abgelehnt { background: var(--red-bg); color: var(--red); }
  .status-badge.status-offen { background: var(--neutral-bg); color: var(--ink-dim); }
  .card-body {
    padding: 0 1.1rem 1.15rem;
    border-top: 1px solid var(--border);
  }
  .card-body p { line-height: 1.6; color: var(--ink); white-space: pre-line; margin: 1rem 0; }
  .field-label {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    margin: 1.1rem 0 0.4rem;
  }
  .vote-block { display: flex; flex-direction: column; gap: 0.4rem; }
  .vote-row { display: flex; gap: 0.5rem; align-items: baseline; font-size: 0.9rem; flex-wrap: wrap; }
  .vote-row .vote-label { min-width: 5.5rem; font-weight: 600; color: var(--ink-dim); flex-shrink: 0; }
  .pill { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.8rem; margin: 0.1rem 0.25rem 0.1rem 0; }
  .pill.fuer { background: var(--green-bg); color: var(--green); }
  .pill.gegen { background: var(--red-bg); color: var(--red); }
  .pill.enthalten { background: var(--neutral-bg); color: var(--ink-dim); }
  .no-vote { color: var(--ink-dim); font-style: italic; font-size: 0.9rem; }
  .meta-line { font-size: 0.85rem; color: var(--ink-dim); margin: 0.2rem 0; }
  .quelle { font-size: 0.8rem; margin-top: 1.1rem; color: var(--ink-faint); }
  .quelle a { color: var(--accent); text-decoration: none; }
  .quelle a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <header>
    <h1>Bundestag-Kompakt</h1>
    <p>Was im Bundestag passiert – kompakt und in einfacher Sprache</p>
  </header>
  <div class="filter-bar" id="search-bar">
    <label for="search-input">Suche:</label>
    <input type="search" id="search-input" placeholder="z.B. Kindergeld, Fluglärm ...">
  </div>
  <div class="filter-bar" id="filter-bar" hidden>
    <label for="period-filter">Zeitraum:</label>
    <select id="period-filter"></select>
  </div>
  <div class="stats-bar" id="stats-bar"></div>
  <main id="app">
    <div class="state-message">Lädt ...</div>
  </main>

<script>
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function pillList(items, cls) {
  if (!items || items.length === 0) return '<span class="no-vote">–</span>';
  return items.map(p => `<span class="pill ${cls}">${esc(p)}</span>`).join("");
}

function renderVote(vote) {
  if (!vote) return `<div class="no-vote">Noch keine Abstimmung / Beschlussempfehlung vorhanden.</div>`;
  return `
    <div class="vote-block">
      <div class="vote-row"><span class="vote-label">Art:</span> ${esc(vote.art)}</div>
      <div class="vote-row"><span class="vote-label">Dafür:</span> ${pillList(vote.dafuer, "fuer")}</div>
      <div class="vote-row"><span class="vote-label">Dagegen:</span> ${pillList(vote.dagegen, "gegen")}</div>
      <div class="vote-row"><span class="vote-label">Enthalten:</span> ${pillList(vote.enthalten, "enthalten")}</div>
    </div>`;
}

function statusOf(entry) {
  if (!entry.abstimmungsergebnis) return "offen";
  return entry.abstimmungsergebnis.ausgang || "offen";
}

const STATUS_LABEL = {
  angenommen: "✓ Angenommen",
  abgelehnt: "✕ Abgelehnt",
  offen: "○ Läuft noch",
};

function renderCard(entry) {
  const status = statusOf(entry);
  return `
    <details class="card status-${status}">
      <summary class="card-summary">
        <h2>${esc(entry.titel)}</h2>
        <span class="summary-right">
          <span class="badge-stack">
            <span class="status-badge status-${status}">${STATUS_LABEL[status]}</span>
            <span class="badge-date">${esc(entry.letzteAenderung)}</span>
          </span>
          <span class="chevron">›</span>
        </span>
      </summary>
      <div class="card-body">
        <p>${esc(entry.zusammenfassung)}</p>
        <div class="field-label">Abstimmungsergebnis</div>
        ${renderVote(entry.abstimmungsergebnis)}
        <div class="field-label">Eingebracht von</div>
        <div class="meta-line">${esc(entry.eingebrachtVon)}</div>
        <div class="field-label">Nächste Schritte</div>
        <div class="meta-line">${esc(entry.naechsteSchritte)}</div>
        <div class="quelle">Letzte Änderung: ${esc(entry.letzteAenderung)} · <a href="${esc(entry.url)}" target="_blank" rel="noopener">Quelle</a></div>
      </div>
    </details>`;
}

function renderStats(entries) {
  const statsBar = document.getElementById("stats-bar");
  if (!entries || entries.length === 0) {
    statsBar.innerHTML = "";
    return;
  }

  const counts = { angenommen: 0, abgelehnt: 0, offen: 0 };
  for (const entry of entries) counts[statusOf(entry)]++;

  statsBar.innerHTML = `
    <span class="stat-chip stat-angenommen">✓ ${counts.angenommen} angenommen</span>
    <span class="stat-chip stat-abgelehnt">✕ ${counts.abgelehnt} abgelehnt</span>
    <span class="stat-chip stat-offen">○ ${counts.offen} laufend</span>
  `;
}

function render(entries) {
  const app = document.getElementById("app");
  renderStats(entries);

  if (!entries || entries.length === 0) {
    app.innerHTML = allEntries.length === 0
      ? `<div class="state-message">Aktuell keine Einträge. Der Bundestag tagt gerade nicht, oder die Datenerfassung läuft noch.</div>`
      : `<div class="state-message">Keine Einträge für diese Suche/diesen Zeitraum gefunden.</div>`;
    return;
  }

  const groups = {};
  for (const entry of entries) {
    const key = entry.themenbereich || "Sonstiges";
    (groups[key] ??= []).push(entry);
  }

  const sortedGroupNames = Object.keys(groups).sort((a, b) => a.localeCompare(b, "de"));

  app.innerHTML = sortedGroupNames
    .map((group) => `
      <div class="group-title">${esc(group)}</div>
      ${groups[group].map(renderCard).join("")}
    `)
    .join("");
}

const MONTH_NAMES = [
  "Januar", "Februar", "März", "April", "Mai", "Juni",
  "Juli", "August", "September", "Oktober", "November", "Dezember",
];

function parseGermanDate(d) {
  if (!d) return null;
  const [day, month, year] = d.split(".").map(Number);
  if (!day || !month || !year) return null;
  return new Date(year, month - 1, day);
}

function monthKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
}

function monthLabel(date) {
  return `${MONTH_NAMES[date.getMonth()]} ${date.getFullYear()}`;
}

let allEntries = [];
let selectedMonth = "alle";

function matchesSearch(entry, query) {
  const haystack = `${entry.titel} ${entry.zusammenfassung} ${entry.themenbereich}`.toLowerCase();
  return haystack.includes(query);
}

function applyFilters() {
  let filtered = allEntries;

  if (selectedMonth !== "alle") {
    filtered = filtered.filter((entry) => {
      const date = parseGermanDate(entry.letzteAenderung);
      return date && monthKey(date) === selectedMonth;
    });
  }

  const query = document.getElementById("search-input").value.trim().toLowerCase();
  if (query) filtered = filtered.filter((entry) => matchesSearch(entry, query));

  render(filtered);
}

function setupFilter(entries) {
  const bar = document.getElementById("filter-bar");
  const select = document.getElementById("period-filter");

  const months = new Map();
  for (const entry of entries) {
    const date = parseGermanDate(entry.letzteAenderung);
    if (!date) continue;
    const key = monthKey(date);
    if (!months.has(key)) months.set(key, monthLabel(date));
  }

  const sortedKeys = [...months.keys()].sort().reverse();
  if (sortedKeys.length <= 1) return; // Filter erst sinnvoll, wenn es was zum Filtern gibt

  select.innerHTML =
    `<option value="alle">Alle</option>` +
    sortedKeys.map((key) => `<option value="${key}">${esc(months.get(key))}</option>`).join("");

  select.addEventListener("change", () => {
    selectedMonth = select.value;
    applyFilters();
  });

  bar.hidden = false;
}

function setupSearch() {
  document.getElementById("search-input").addEventListener("input", applyFilters);
}

fetch("data/index.json")
  .then((res) => {
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  })
  .then((entries) => {
    allEntries = entries;
    render(entries);
    setupFilter(entries);
    setupSearch();
  })
  .catch((err) => {
    document.getElementById("app").innerHTML =
      `<div class="state-message">Daten konnten nicht geladen werden (${err.message}).</div>`;
  });
</script>
</body>
</html>
