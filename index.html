<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bundestag-Kompakt</title>
<style>
  :root {
    --navy-900: #0f172a;
    --navy-800: #1e293b;
    --slate-600: #475569;
    --slate-400: #94a3b8;
    --slate-200: #e2e8f0;
    --bg: #f8fafc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--navy-900);
  }
  header {
    background: var(--navy-800);
    color: white;
    padding: 1.25rem 1.5rem;
  }
  header h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 600;
  }
  header p {
    margin: 0.25rem 0 0;
    color: var(--slate-400);
    font-size: 0.875rem;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 3rem 1.5rem;
    text-align: center;
  }
  .placeholder {
    border: 1px dashed var(--slate-400);
    border-radius: 12px;
    padding: 2.5rem 1.5rem;
    color: var(--slate-600);
  }
  .placeholder h2 {
    margin-top: 0;
    color: var(--navy-800);
  }
</style>
</head>
<body>
  <header>
    <h1>Bundestag-Kompakt</h1>
    <p>Kompakte Zusammenfassung dessen, was im Bundestag passiert</p>
  </header>
  <main>
    <div class="placeholder">
      <h2>Grundgerüst steht</h2>
      <p>Hier erscheinen bald die Zusammenfassungen aus dem Bundestag – gruppiert nach Themen, mit Detailansicht pro Beschluss.</p>
    </div>
  </main>
</body>
</html>
