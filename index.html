<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bundestag-Kompakt</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#eef4f6">
<style>
  :root {
    --bg: #eef4f6;
    --surface: #ffffff;
    --border: #d3e2e7;
    --ink: #16232b;
    --ink-dim: #5e7480;
    --ink-faint: #93aab5;
    --accent: #1f6f8b;
    --accent-soft: rgba(31, 111, 139, 0.12);

    --green: #2f8f5b;
    --green-bg: rgba(47, 143, 91, 0.12);
    --red: #c24b3f;
    --red-bg: rgba(194, 75, 63, 0.12);
    --neutral: #93aab5;
    --neutral-bg: rgba(147, 171, 181, 0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse 900px 500px at 50% -8%, #ffffff 0%, var(--bg) 65%) var(--bg);
    background-attachment: fixed;
    color: var(--ink);
  }
  header {
    padding: 2.25rem 1.5rem 1.5rem;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.6rem; font-weight: 300; letter-spacing: 0.01em; color: var(--ink); }
  header p { margin: 0.35rem 0 0; color: var(--ink-dim); font-size: 0.875rem; }
  header .dateline {
    margin: 0.6rem 0 0;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 0.75rem;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  .filter-bar {
    max-width: 640px;
    margin: 0 auto;
    padding: 0.6rem 1.5rem 0;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .filter-bar[hidden] { display: none; }
  .filter-bar label { font-size: 0.85rem; color: var(--ink-dim); flex-shrink: 0; }
  .filter-bar select,
  .filter-bar input[type="search"] {
    font-size: 0.85rem;
    padding: 0.45rem 0.8rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
  }
  .filter-bar select:focus,
  .filter-bar input[type="search"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .filter-bar input[type="search"] { flex: 1; min-width: 0; }
  .stats-bar {
    max-width: 640px;
    margin: 0.9rem auto 0;
    padding: 0 1.5rem;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .stat-chip {
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.3rem 0.8rem;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink-dim);
  }
  .stat-chip.stat-angenommen { color: var(--green); }
  .stat-chip.stat-abgelehnt { color: var(--red); }
  main { max-width: 640px; margin: 0 auto; padding: 1.75rem 1.5rem; }
  .state-message {
    text-align: center;
    color: var(--ink-dim);
    padding: 3rem 1rem;
  }
  .group-title {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--ink-faint);
    text-align: center;
    margin: 2.5rem 0 0.9rem;
  }
  .group-title:first-child { margin-top: 0; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    margin-bottom: 0.7rem;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(22, 35, 43, 0.04);
  }
  .card-summary:hover { background: #fbfdfd; }
  .card-summary {
    padding: 1.05rem 1.2rem;
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: flex-start;
    gap: 1rem;
  }
  .card-summary::-webkit-details-marker { display: none; }
  .ring {
    flex-shrink: 0;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 999px;
    border: 2px solid var(--ring-c, var(--neutral));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--ring-c, var(--neutral));
    margin-top: 0.1rem;
  }
  .ring.status-angenommen { --ring-c: var(--green); }
  .ring.status-abgelehnt { --ring-c: var(--red); }
  .titlewrap { flex: 1 1 auto; min-width: 0; }
  .card-summary h2 {
    margin: 0 0 0.3rem;
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.4;
  }
  .card-meta {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 0.72rem;
    color: var(--accent);
  }
  .chevron { color: var(--ink-faint); flex-shrink: 0; transition: transform 0.15s ease; margin-top: 0.35rem; }
  details[open] .chevron { transform: rotate(90deg); }
  .card-body {
    padding: 0 1.2rem 1.2rem 3.5rem;
    border-top: 1px solid var(--border);
  }
  .card-body p { line-height: 1.65; color: var(--ink); white-space: pre-line; margin: 1.1rem 0; }
  .field-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-faint);
    margin: 1.15rem 0 0.4rem;
  }
  .vote-block { display: flex; flex-direction: column; gap: 0.4rem; }
  .vote-row { display: flex; gap: 0.5rem; align-items: baseline; font-size: 0.9rem; flex-wrap: wrap; }
  .vote-row .vote-label { min-width: 5.5rem; font-weight: 600; color: var(--ink-dim); flex-shrink: 0; }
  .pill { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.8rem; margin: 0.1rem 0.25rem 0.1rem 0; }
  .pill.fuer { background: var(--green-bg); color: var(--green); }
  .pill.gegen { background: var(--red-bg); color: var(--red); }
  .pill.enthalten { background: var(--neutral-bg); color: var(--ink-dim); }
  .no-vote { color: var(--ink-dim); font-style: italic; font-size: 0.9rem; }
  .meta-line { font-size: 0.85rem; color: var(--ink-dim); margin: 0.2rem 0; }
  .quelle {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 0.75rem;
    margin-top: 1.15rem;
    color: var(--ink-faint);
  }
  .quelle a { color: var(--accent); text-decoration: none; font-family: -apple-system, "Segoe UI", sans-serif; }
  .quelle a:hover { text-decoration: underline; }

  .digest { max-width: 640px; margin: 0 auto; padding: 1.75rem 1.5rem 0; }
  .digest-panel {
    background: linear-gradient(180deg, #ffffff, var(--bg));
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1.4rem 1.5rem 0.5rem;
  }
  .digest-title {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--accent);
    margin: 0 0 0.25rem;
  }
  .digest-sub { font-size: 0.8rem; color: var(--ink-dim); margin: 0 0 1rem; }
  .digest-item {
    display: flex;
    gap: 0.8rem;
    align-items: flex-start;
    padding: 0.75rem 0;
    border-top: 1px solid var(--border);
  }
  .digest-item:first-of-type { border-top: none; padding-top: 0; }
  .digest-item .ring { width: 1.9rem; height: 1.9rem; font-size: 0.72rem; margin-top: 0.05rem; }
  .digest-link {
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    font-size: 0.95rem;
    line-height: 1.4;
    display: block;
  }
  .digest-link:hover { color: var(--accent); }
  .digest-why { font-size: 0.83rem; color: var(--ink-dim); margin-top: 0.3rem; }
</style>
</head>
<body>
  <header>
    <h1>Bundestag-Kompakt</h1>
    <p>Was im Bundestag passiert – kompakt und in einfacher Sprache</p>
    <p class="dateline" id="dateline"></p>
  </header>
  <div class="digest" id="digest"></div>
  <div class="filter-bar" id="search-bar">
    <label for="search-input">Suche:</label>
    <input type="search" id="search-input" placeholder="z.B. Kindergeld, Fluglärm ...">
  </div>
  <div class="filter-bar" id="filter-bar" hidden>
    <label for="period-filter">Zeitraum:</label>
    <select id="period-filter"></select>
  </div>
  <div class="stats-bar" id="stats-bar"></div>
  <main id="app">
    <div class="state-message">Lädt ...</div>
  </main>

<script>
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function pillList(items, cls) {
  if (!items || items.length === 0) return '<span class="no-vote">–</span>';
  return items.map(p => `<span class="pill ${cls}">${esc(p)}</span>`).join("");
}

function renderVote(vote) {
  if (!vote) return `<div class="no-vote">Noch keine Abstimmung / Beschlussempfehlung vorhanden.</div>`;
  return `
    <div class="vote-block">
      <div class="vote-row"><span class="vote-label">Art:</span> ${esc(vote.art)}</div>
      <div class="vote-row"><span class="vote-label">Dafür:</span> ${pillList(vote.dafuer, "fuer")}</div>
      <div class="vote-row"><span class="vote-label">Dagegen:</span> ${pillList(vote.dagegen, "gegen")}</div>
      <div class="vote-row"><span class="vote-label">Enthalten:</span> ${pillList(vote.enthalten, "enthalten")}</div>
    </div>`;
}

function statusOf(entry) {
  if (!entry.abstimmungsergebnis) return "offen";
  return entry.abstimmungsergebnis.ausgang || "offen";
}

const RING_SYMBOL = { angenommen: "✓", abgelehnt: "✕", offen: "…" };

// ISO-8601-Kalenderwoche (montags beginnend, Woche mit erstem Donnerstag des Jahres = KW 1)
function isoWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
  return 1 + Math.round((d - firstThursday) / (7 * 24 * 3600 * 1000));
}

function dateWithWeek(entry) {
  const date = parseGermanDate(entry.letzteAenderung);
  if (!date) return esc(entry.letzteAenderung);
  return `${esc(entry.letzteAenderung)} · KW ${isoWeek(date)}`;
}

function renderCard(entry) {
  const status = statusOf(entry);
  const warum = entry.warumRelevant
    ? `<div class="field-label">Warum das für dich wichtig ist</div><p>${esc(entry.warumRelevant)}</p>`
    : "";
  return `
    <details class="card status-${status}" id="entry-${esc(entry.docid)}">
      <summary class="card-summary">
        <span class="ring status-${status}">${RING_SYMBOL[status]}</span>
        <span class="titlewrap">
          <h2>${esc(entry.titel)}</h2>
          <span class="card-meta">${dateWithWeek(entry)}</span>
        </span>
        <span class="chevron">›</span>
      </summary>
      <div class="card-body">
        <p>${esc(entry.zusammenfassung)}</p>
        ${warum}
        <div class="field-label">Abstimmungsergebnis</div>
        ${renderVote(entry.abstimmungsergebnis)}
        <div class="field-label">Eingebracht von</div>
        <div class="meta-line">${esc(entry.eingebrachtVon)}</div>
        <div class="field-label">Nächste Schritte</div>
        <div class="meta-line">${esc(entry.naechsteSchritte)}</div>
        <div class="quelle">${dateWithWeek(entry)} · <a href="${esc(entry.url)}" target="_blank" rel="noopener">Quelle</a></div>
      </div>
    </details>`;
}

function renderStats(entries) {
  const statsBar = document.getElementById("stats-bar");
  if (!entries || entries.length === 0) {
    statsBar.innerHTML = "";
    return;
  }

  const counts = { angenommen: 0, abgelehnt: 0, offen: 0 };
  for (const entry of entries) counts[statusOf(entry)]++;

  statsBar.innerHTML = `
    <span class="stat-chip stat-angenommen">✓ ${counts.angenommen} angenommen</span>
    <span class="stat-chip stat-abgelehnt">✕ ${counts.abgelehnt} abgelehnt</span>
    <span class="stat-chip stat-offen">○ ${counts.offen} laufend</span>
  `;
}

function render(entries) {
  const app = document.getElementById("app");
  renderStats(entries);

  if (!entries || entries.length === 0) {
    app.innerHTML = allEntries.length === 0
      ? `<div class="state-message">Aktuell keine Einträge. Der Bundestag tagt gerade nicht, oder die Datenerfassung läuft noch.</div>`
      : `<div class="state-message">Keine Einträge für diese Suche/diesen Zeitraum gefunden.</div>`;
    return;
  }

  const groups = {};
  for (const entry of entries) {
    const key = entry.themenbereich || "Sonstiges";
    (groups[key] ??= []).push(entry);
  }

  const sortedGroupNames = Object.keys(groups).sort((a, b) => a.localeCompare(b, "de"));

  app.innerHTML = sortedGroupNames
    .map((group) => `
      <div class="group-title">${esc(group)}</div>
      ${groups[group].map(renderCard).join("")}
    `)
    .join("");
}

const MONTH_NAMES = [
  "Januar", "Februar", "März", "April", "Mai", "Juni",
  "Juli", "August", "September", "Oktober", "November", "Dezember",
];

function parseGermanDate(d) {
  if (!d) return null;
  const [day, month, year] = d.split(".").map(Number);
  if (!day || !month || !year) return null;
  return new Date(year, month - 1, day);
}

function monthKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
}

function monthLabel(date) {
  return `${MONTH_NAMES[date.getMonth()]} ${date.getFullYear()}`;
}

let allEntries = [];
let selectedMonth = "alle";

function matchesSearch(entry, query) {
  const haystack = `${entry.titel} ${entry.zusammenfassung} ${entry.themenbereich}`.toLowerCase();
  return haystack.includes(query);
}

function applyFilters() {
  let filtered = allEntries;

  if (selectedMonth !== "alle") {
    filtered = filtered.filter((entry) => {
      const date = parseGermanDate(entry.letzteAenderung);
      return date && monthKey(date) === selectedMonth;
    });
  }

  const query = document.getElementById("search-input").value.trim().toLowerCase();
  if (query) filtered = filtered.filter((entry) => matchesSearch(entry, query));

  render(filtered);
}

function setupFilter(entries) {
  const bar = document.getElementById("filter-bar");
  const select = document.getElementById("period-filter");

  const months = new Map();
  for (const entry of entries) {
    const date = parseGermanDate(entry.letzteAenderung);
    if (!date) continue;
    const key = monthKey(date);
    if (!months.has(key)) months.set(key, monthLabel(date));
  }

  const sortedKeys = [...months.keys()].sort().reverse();
  if (sortedKeys.length <= 1) return; // Filter erst sinnvoll, wenn es was zum Filtern gibt

  select.innerHTML =
    `<option value="alle">Alle</option>` +
    sortedKeys.map((key) => `<option value="${key}">${esc(months.get(key))}</option>`).join("");

  select.addEventListener("change", () => {
    selectedMonth = select.value;
    applyFilters();
  });

  bar.hidden = false;
}

function setupSearch() {
  document.getElementById("search-input").addEventListener("input", applyFilters);
}

function renderDateline() {
  const today = new Date();
  const formatted = `${String(today.getDate()).padStart(2, "0")}.${String(today.getMonth() + 1).padStart(2, "0")}.${today.getFullYear()}`;
  document.getElementById("dateline").textContent = `Stand: KW ${isoWeek(today)} · ${formatted}`;
}
renderDateline();

function renderDigest(digest) {
  const container = document.getElementById("digest");
  if (!digest || !digest.top || digest.top.length === 0) {
    container.innerHTML = "";
    return;
  }

  const items = digest.top
    .map((e) => `
      <div class="digest-item">
        <span class="ring status-${e.ausgang}">${RING_SYMBOL[e.ausgang] ?? RING_SYMBOL.offen}</span>
        <div>
          <a class="digest-link" href="#entry-${esc(e.docid)}" data-docid="${esc(e.docid)}">${esc(e.titel)}</a>
          ${e.warumRelevant ? `<div class="digest-why">${esc(e.warumRelevant)}</div>` : ""}
        </div>
      </div>`)
    .join("");

  container.innerHTML = `
    <div class="digest-panel">
      <div class="digest-title">Wochenüberblick · KW ${digest.kw}</div>
      <div class="digest-sub">Die ${digest.top.length} alltagsrelevantesten Entscheidungen dieser Sitzungswoche, von ${digest.anzahlVorgaengeGesamt} insgesamt.</div>
      ${items}
    </div>`;

  container.querySelectorAll(".digest-link").forEach((link) => {
    link.addEventListener("click", (ev) => {
      ev.preventDefault();
      const target = document.getElementById(`entry-${link.dataset.docid}`);
      if (!target) return;
      target.open = true;
      target.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  });
}

fetch("data/digest-woche-aktuell.json")
  .then((res) => (res.ok ? res.json() : null))
  .then(renderDigest)
  .catch(() => renderDigest(null));

fetch("data/index.json")
  .then((res) => {
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  })
  .then((entries) => {
    allEntries = entries;
    render(entries);
    setupFilter(entries);
    setupSearch();
  })
  .catch((err) => {
    document.getElementById("app").innerHTML =
      `<div class="state-message">Daten konnten nicht geladen werden (${err.message}).</div>`;
  });
</script>
</body>
</html>
