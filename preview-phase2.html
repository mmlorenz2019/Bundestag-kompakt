<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bundestag-Kompakt – Vorschau Phase 2</title>
<style>
  :root {
    --navy-900: #0f172a;
    --navy-800: #1e293b;
    --slate-600: #475569;
    --slate-400: #94a3b8;
    --slate-200: #e2e8f0;
    --slate-100: #f1f5f9;
    --bg: #f8fafc;
    --green-700: #15803d;
    --green-100: #dcfce7;
    --red-700: #b91c1c;
    --red-100: #fee2e2;
    --amber-700: #b45309;
    --amber-100: #fef3c7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--navy-900);
  }
  header {
    background: var(--navy-800);
    color: white;
    padding: 1.25rem 1.5rem;
  }
  header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
  header p { margin: 0.25rem 0 0; color: var(--slate-400); font-size: 0.875rem; }
  .banner {
    max-width: 720px;
    margin: 1rem auto 0;
    padding: 0.6rem 1rem;
    background: var(--amber-100);
    color: var(--amber-700);
    border-radius: 8px;
    font-size: 0.8rem;
    text-align: center;
  }
  main { max-width: 720px; margin: 0 auto; padding: 1.5rem; }
  .group-title {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--slate-600);
    margin: 2rem 0 0.75rem;
  }
  .group-title:first-child { margin-top: 0; }
  .card {
    background: white;
    border: 1px solid var(--slate-200);
    border-radius: 12px;
    margin-bottom: 0.75rem;
    overflow: hidden;
  }
  .card-summary {
    padding: 1rem 1.1rem;
    cursor: pointer;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
  }
  .card-summary::-webkit-details-marker { display: none; }
  .card-summary h2 {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    color: var(--navy-800);
  }
  .chevron { color: var(--slate-400); flex-shrink: 0; transition: transform 0.15s ease; }
  details[open] .chevron { transform: rotate(90deg); }
  .card-body {
    padding: 0 1.1rem 1.1rem;
    border-top: 1px solid var(--slate-100);
  }
  .card-body p { line-height: 1.55; color: var(--navy-800); }
  .field-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--slate-600);
    margin: 1rem 0 0.35rem;
  }
  .vote-block { display: flex; flex-direction: column; gap: 0.4rem; }
  .vote-row { display: flex; gap: 0.5rem; align-items: baseline; font-size: 0.9rem; }
  .vote-row .vote-label { min-width: 5.5rem; font-weight: 600; color: var(--slate-600); flex-shrink: 0; }
  .pill { display: inline-block; padding: 0.15rem 0.55rem; border-radius: 999px; font-size: 0.8rem; margin: 0.1rem 0.25rem 0.1rem 0; }
  .pill.fuer { background: var(--green-100); color: var(--green-700); }
  .pill.gegen { background: var(--red-100); color: var(--red-700); }
  .pill.enthalten { background: var(--slate-100); color: var(--slate-600); }
  .no-vote { color: var(--slate-600); font-style: italic; font-size: 0.9rem; }
  .meta-line { font-size: 0.85rem; color: var(--slate-600); margin: 0.2rem 0; }
  .quelle { font-size: 0.8rem; margin-top: 1rem; }
  .quelle a { color: var(--navy-800); }
</style>
</head>
<body>
  <header>
    <h1>Bundestag-Kompakt</h1>
    <p>Vorschau: so sehen einzelne Einträge im Zielformat aus</p>
  </header>
  <div class="banner">Nur eine Vorschau zum Testen von Phase 2 — kein Teil der finalen Webseite (die kommt in Phase 4).</div>
  <main id="app"></main>

<script>
const entries = [
  {
    "docid": "1152",
    "url": "https://bundestagszusammenfasser.de/details?docid=1152",
    "letzteAenderung": "09.07.2026",
    "titel": "Kindergeld soll's künftig automatisch geben – ganz ohne Antrag",
    "zusammenfassung": "Bisher musste man Kindergeld immer aktiv beantragen. Künftig soll die Familienkasse das Geld nach einer Geburt automatisch auszahlen können, wenn sie ohnehin schon alle nötigen Infos hat (z.B. über die Geburtsmeldung) und eine Kontoverbindung bekannt ist – ganz ohne dass die Eltern etwas beantragen müssen. Zunächst gilt das ab dem zweiten Kind, später soll es auch für das erste Kind kommen. Ziel: weniger Papierkram für frischgebackene Eltern, weniger Verwaltungsaufwand für den Staat. Kritikpunkt aus Anhörungen (u.a. vom Deutschen Kinderhilfswerk): das automatische Verfahren gilt vorerst nur für Familien mit Wohnsitz in Deutschland und mindestens einem erwerbstätigen Elternteil – nicht-erwerbstätige Eltern, die oft besonders auf Unterstützung angewiesen sind, profitieren also (noch) nicht davon. Start: ab 1. Januar 2027, schrittweise.",
    "abstimmungsergebnis": {
      "art": "Ausschuss-Empfehlung (Handzeichen, keine namentliche Abstimmung)",
      "dafuer": ["CDU/CSU", "SPD", "Bündnis 90/Die Grünen"],
      "dagegen": [],
      "enthalten": ["AfD", "Die Linke"]
    },
    "eingebrachtVon": "Bundesregierung (Bundesministerium für Finanzen)",
    "themenbereich": "Soziales / Familie",
    "naechsteSchritte": "Muss noch durch den Bundesrat (dort bereits einmal beraten, Status \"Beraten\", noch nicht final abgestimmt)"
  },
  {
    "docid": "1197",
    "url": "https://bundestagszusammenfasser.de/details?docid=1197",
    "letzteAenderung": "29.07.2026",
    "titel": "Mehr Schutz vor Fluglärm: Bußgelder für Airlines sollen kommen",
    "zusammenfassung": "Die Regierung will das Luftverkehrsgesetz ändern, um Menschen besser vor Fluglärm zu schützen. Wichtigste Punkte: Flughäfen sollen leisere Flugzeuge künftig finanziell belohnen. Wenn gegen Nachtflug- oder andere Betriebsbeschränkungen verstoßen wird, soll künftig nicht mehr nur der Pilot, sondern auch direkt die Fluggesellschaft mit einem Bußgeld von bis zu 50.000 Euro belangt werden können. Rettungshubschrauber (z.B. vom ADAC) sollen ausdrücklich von diesen Einschränkungen ausgenommen bleiben. Außerdem sollen die örtlichen Fluglärmkommissionen stärker eingebunden werden und die Öffentlichkeit besser informieren. In den Stellungnahmen gehen die Meinungen deutlich auseinander: Umwelt- und Lärmschutzverbände (u.a. die Bundesvereinigung gegen Fluglärm) finden die Änderungen zu zaghaft und fordern schärfere Regeln. Die Luftfahrtbranche (u.a. der Bundesverband der Deutschen Luftverkehrswirtschaft) lehnt dagegen gerade die neue Bußgeld-Haftung für Fluggesellschaften ab und befürchtet Rechtsunsicherheit. Mehrere Verbände kritisierten zudem, dass sie nur 3 Tage Zeit für eine Stellungnahme hatten.",
    "abstimmungsergebnis": null,
    "eingebrachtVon": "Bundesregierung (Bundesministerium für Verkehr)",
    "themenbereich": "Umwelt / Verkehr",
    "naechsteSchritte": "Ist gerade erst im Bundestag eingegangen, erste Lesung und Ausschussberatung stehen noch aus"
  }
];

function pillList(items, cls) {
  if (!items || items.length === 0) return '<span class="no-vote">–</span>';
  return items.map(p => `<span class="pill ${cls}">${p}</span>`).join("");
}

function renderVote(vote) {
  if (!vote) return `<div class="no-vote">Noch keine Abstimmung / Beschlussempfehlung vorhanden.</div>`;
  return `
    <div class="vote-block">
      <div class="vote-row"><span class="vote-label">Art:</span> ${vote.art}</div>
      <div class="vote-row"><span class="vote-label">Dafür:</span> ${pillList(vote.dafuer, "fuer")}</div>
      <div class="vote-row"><span class="vote-label">Dagegen:</span> ${pillList(vote.dagegen, "gegen")}</div>
      <div class="vote-row"><span class="vote-label">Enthalten:</span> ${pillList(vote.enthalten, "enthalten")}</div>
    </div>`;
}

function renderCard(entry) {
  return `
    <details class="card">
      <summary class="card-summary">
        <h2>${entry.titel}</h2>
        <span class="chevron">›</span>
      </summary>
      <div class="card-body">
        <p>${entry.zusammenfassung}</p>
        <div class="field-label">Abstimmungsergebnis</div>
        ${renderVote(entry.abstimmungsergebnis)}
        <div class="field-label">Eingebracht von</div>
        <div class="meta-line">${entry.eingebrachtVon}</div>
        <div class="field-label">Nächste Schritte</div>
        <div class="meta-line">${entry.naechsteSchritte}</div>
        <div class="quelle">Letzte Änderung: ${entry.letzteAenderung} · <a href="${entry.url}" target="_blank" rel="noopener">Quelle</a></div>
      </div>
    </details>`;
}

const groups = {};
for (const entry of entries) {
  (groups[entry.themenbereich] ??= []).push(entry);
}

const app = document.getElementById("app");
app.innerHTML = Object.entries(groups)
  .map(([group, items]) => `
    <div class="group-title">${group}</div>
    ${items.map(renderCard).join("")}
  `)
  .join("");
</script>
</body>
</html>
